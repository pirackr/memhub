[project]
name = "memhub"
version = "0.1.0"
description = "Raw memory store for AI agents: path-addressed memories in SQLite"
readme = "README.md"
authors = [
    { name = "pirackr", email = "pirackr.inbox@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "tomli-w",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
