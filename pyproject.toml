[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memhub"
version = "1.0.0"
description = "Local SQLite text vault with filesystem-like virtual paths."
requires-python = ">=3.11"
dependencies = [
    # Pinned for v1 and lazy-loaded behind the import layer only. Normal
    # library import and CLI startup must never pay this import cost.
    "chardet==5.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memhub = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
